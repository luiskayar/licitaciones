name: Búsqueda de licitaciones

on:
  schedule:
    # 6:30 a.m. Costa Rica = 12:30 UTC (el país no aplica horario de verano).
    # Días 1, 3 y 5 = lunes, miércoles y viernes.
    - cron: '30 12 * * 1,3,5'
  workflow_dispatch: {}       # botón "Run workflow" para lanzarla a mano

permissions:
  contents: write             # necesario para guardar los resultados en la rama
  pages: write
  id-token: write

concurrency:
  group: busqueda
  cancel-in-progress: false   # si ya hay una búsqueda corriendo, esta espera

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 45       # margen amplio sobre los 10-20 min esperados

    steps:
      # Sin "ref" explícito toma la rama desde la que se lanzó el workflow,
      # así funciona igual en diego que en main sin editar este archivo.
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependencias
        run: npm install

      # Explícito a propósito: si alguien toca los scripts de package.json, el
      # navegador se sigue instalando y la búsqueda no se rompe en silencio.
      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar la búsqueda
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/index.js

      - name: Guardar resultados en el repositorio
        run: |
          git config user.name "delphos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin resultados nuevos que guardar"
            exit 0
          fi
          git commit -m "Actualiza datos: búsqueda automática $(date -u +%Y-%m-%d)"
          git pull --rebase origin "$RAMA"
          git push origin "HEAD:$RAMA"
        env:
          RAMA: ${{ github.ref_name }}

  publicar:
    needs: buscar
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
